# goast's own policy tests. Run from the repository root with:
#
#     goast test
#
# This dogfoods the `test` subcommand against the bundled example policy.
[test]
policy = "policy/do_not_use_println.rego"

[[test.cases]]
name = "flags fmt.Println with the right line, message and severity"
source = "examples/println/main.go"
expect = "fail"
count = 1

[[test.cases.violations]]
line = 6
message = "do not use fmt.Println"
severity = "ERROR"

[[test.cases]]
name = "auto-generated files are skipped when ignore_auto_generated is set"
source = "examples/autogen/main.go"
ignore_auto_generated = true
expect = "pass"

[[test.cases]]
name = "auto-generated files are still flagged by default"
source = "examples/autogen/main.go"
expect = "fail"
count = 1
